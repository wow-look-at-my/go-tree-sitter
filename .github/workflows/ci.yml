name: CI

on:
  push:
    branches: ['**']

permissions:
  id-token: write
  contents: write
  actions: read
  checks: read
  deployments: write
  artifact-metadata: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: wow-look-at-my/go-toolchain@master
        with:
          # Approves the //go:generate directives that translate each grammar's
          # parser.c. Re-run go-toolchain locally after editing one: the failure
          # prints the value to paste here.
          generate: 22412af311a7
